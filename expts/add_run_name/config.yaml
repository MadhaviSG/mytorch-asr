
Name: "HW4-P2"

###### Tokenization ------------------------------------------------------------
tokenization:
  token_type: "char"  # Character-level works well for CER metric
  token_map:
      'char': 'hw4lib/data/tokenizer_jsons/tokenizer_char.json'
      '1k': 'hw4lib/data/tokenizer_jsons/tokenizer_1000.json'
      '5k': 'hw4lib/data/tokenizer_jsons/tokenizer_5000.json'
      '10k': 'hw4lib/data/tokenizer_jsons/tokenizer_10000.json'

###### Dataset -----------------------------------------------------------------
data:
  root: "/ocean/projects/cis240101p/mzhang23/TA/HW4/hw4_data/hw4p2_data"
  train_partition: "train-clean-100"
  val_partition: "dev-clean"
  test_partition: "test-clean"
  subset: 1.0
  batch_size: 32  # Increase for better gradient estimates
  NUM_WORKERS: 4
  norm: 'global_mvn'  # Global normalization is most stable
  num_feats: 80

  ###### SpecAugment ---------------------------------------------------------------
  specaug: True  # CRITICAL for generalization
  specaug_conf:
    apply_freq_mask: True
    freq_mask_width_range: 27  # Increase for stronger augmentation
    num_freq_mask: 2
    apply_time_mask: True
    time_mask_width_range: 100  # Increase time masking
    num_time_mask: 2

###### Network Specs -------------------------------------------------------------
model:
  # Speech embedding parameters
  input_dim: 80
  time_reduction: 4  # Reduce to 4 for efficiency (critical!)
  reduction_method: 'both'  # Use both conv + LSTM for best features

  # Architecture parameters
  d_model: 512  # Increase model capacity
  num_encoder_layers: 6  # More encoder layers
  num_decoder_layers: 6  # More decoder layers
  num_encoder_heads: 8
  num_decoder_heads: 8
  d_ff_encoder: 2048  # Larger FFN
  d_ff_decoder: 2048
  skip_encoder_pe: True  # Skip PE for encoder (LSTM already has temporal info)
  skip_decoder_pe: False

  # Common parameters
  dropout: 0.1  # Start with some regularization
  layer_drop_rate: 0.0
  weight_tying: True  # Reduce parameters

###### Common Training Parameters ------------------------------------------------
training:
  use_wandb: True
  wandb_run_id: "none"
  resume: True
  gradient_accumulation_steps: 2  # Effective batch = 32 * 2 = 64
  wandb_project: "hw4p2-high-cutoff"

###### Loss ----------------------------------------------------------------------
loss:
  label_smoothing: 0.1  # Helps with generalization
  ctc_weight: 0.3  # CTC helps with alignment (increase later)

###### Optimizer -----------------------------------------------------------------
optimizer:
  name: "adamw"
  lr: 0.0005  # Higher initial LR

  weight_decay: 0.0001  # Add regularization

  param_groups:
    - name: self_attn
      patterns: ["self_attn"]
      lr: 0.0004
      layer_decay:
        enabled: False
        decay_rate: 0.8

    - name: ffn
      patterns: ["ffn"]
      lr: 0.0004
      layer_decay:
        enabled: False
        decay_rate: 0.8

  layer_decay:
    enabled: False
    decay_rate: 0.75

  sgd:
    momentum: 0.9
    nesterov: True
    dampening: 0

  adam:
    betas: [0.9, 0.98]  # Use 0.98 for second moment
    eps: 1.0e-9
    amsgrad: False

  adamw:
    betas: [0.9, 0.98]
    eps: 1.0e-9
    amsgrad: False

###### Scheduler -----------------------------------------------------------------
scheduler:
  name: "cosine_warm"

  reduce_lr:
    mode: "min"
    factor: 0.5
    patience: 3
    threshold: 0.001
    threshold_mode: "rel"
    cooldown: 0
    min_lr: 1.0e-6
    eps: 1e-8

  cosine:
    T_max: 30
    eta_min: 1.0e-6
    last_epoch: -1

  cosine_warm:
    T_0: 10  # First cycle length
    T_mult: 2  # Double cycle length each restart
    eta_min: 1.0e-6
    last_epoch: -1

  warmup:
    enabled: True
    type: "linear"
    epochs: 3  # Reduce warmup epochs
    start_factor: 0.1
    end_factor: 1.0
